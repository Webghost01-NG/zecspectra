version: '3.8'

services:
  zebrad:
    image: zfnd/zebra:latest
    container_name: zecspectra-zebrad
    restart: unless-stopped
    ports:
      - "8232:8232"
      - "8233:8233"
    volumes:
      - ./zebra.toml:/etc/zebrad.toml:ro
      - zebra_cache:/home/zebra/.cache/zebra
    command: ["zebrad", "-c", "/etc/zebrad.toml", "start"]

volumes:
  zebra_cache:
